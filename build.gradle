plugins {
    id 'com.barrybecker4.bb4.scala-library' version '3.0-SNAPSHOT'
    id 'com.barrybecker4.bb4.publish' version '3.0-SNAPSHOT'
    id 'com.barrybecker4.bb4.application' version '3.0-SNAPSHOT'
}

description = 'Implementations for shortest path algorithms'
group = 'com.barrybecker4'
version = '3.0-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-shortest-paths')
    mainClass.set('com.barrybecker4.discreteoptimization.pathviewer.PathViewerApp')
}

test {
    systemProperty 'shortestpaths.updateFixtures',
        System.getProperty('shortestpaths.updateFixtures', 'false')
    systemProperty 'shortestpaths.includeSlow',
        System.getProperty('shortestpaths.includeSlow', 'false')
    // Allow headless mode for GUI tests in CI
    systemProperty 'java.awt.headless',
        System.getProperty('java.awt.headless', 'false')
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Accuracy and performance baseline, including road_network_01. Not part of test.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.barrybecker4.discreteoptimization.benchmark.BaselineBenchmark'
    dependsOn tasks.named('classes')
}

dependencies {
    implementation 'com.barrybecker4:bb4-common:3.0-SNAPSHOT'
    implementation 'com.barrybecker4:bb4-math:3.0-SNAPSHOT'
    // for graph visualization
    implementation 'org.graphstream:gs-core:2.0'
    implementation 'org.graphstream:gs-ui-swing:2.0'
}

tasks.named('scaladoc', org.gradle.api.tasks.scala.ScalaDoc) {
    scalaDocOptions {
        additionalParameters = ['-nowarn']
    }
}
